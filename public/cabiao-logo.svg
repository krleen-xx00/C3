<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cabiao National Senior High School Official Logo">
  <defs>
    <path id="cabiao-top-arc" d="M 18,60 A 42,42 0 1,1 102,60" fill="none" />
    <path id="cabiao-bottom-arc" d="M 100,60 A 40,40 0 0,1 20,60" fill="none" />
    <clipPath id="inner-circle-clip">
