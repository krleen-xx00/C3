    <path d="M 25,68 C 21,69 20,72 23,73 C 24,72 26,70 25,68 Z" />
    <path d="M 27,74 C 23,76 23,79 26,79 C 27,78 28,75 27,74 Z" />
    <path d="M 97,67 Q 99,73 96,78 Q 97,73 95,69 Z" />
